<title>Sacrament Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app shell — fixed header + tabs, each tab keeps its controls on top and scrolls only its table, whose header row stays pinned. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --sunk:#eef1f4; --ink:#18212b; --muted:#5a6575; --line:#dbe1e7;
  --accent:#28585c; --accent-ink:#ffffff; --accent-soft:#e1edec;
  --ok:#2b7a4b; --ok-soft:#e3f2e8; --warn:#9a6400; --warn-soft:#fbf0d9; --bad:#b0463a; --bad-soft:#f8e4e1;
  --fix:#2c5c9a; --fix-soft:#e2ebf7; --none:#6b7380; --none-soft:#eceef1;
  --mark:#c28a00; --mark-soft:#fff3cf; --field:#ffffff; --fieldline:#c9d1da; --cardline:#dbe1e7;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0e13; --surface:#1a232e; --sunk:#243040; --ink:#f1f4f7; --muted:#b0bac7; --line:#3d4b5c; --field:#0e141b; --fieldline:#556377; --cardline:#46566a;
  --accent:#7db4b6; --accent-ink:#0e1a1b; --accent-soft:#1d3335;
  --ok:#6cc893; --ok-soft:#173023; --warn:#e2b053; --warn-soft:#352a12; --bad:#ec8b7e; --bad-soft:#3a1d1a;
  --fix:#8cb4ec; --fix-soft:#1a2a40; --none:#a3abb7; --none-soft:#242c36;
  --mark:#f0c14b; --mark-soft:#3a3115; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e13; --surface:#1a232e; --sunk:#243040; --ink:#f1f4f7; --muted:#b0bac7; --line:#3d4b5c; --field:#0e141b; --fieldline:#556377; --cardline:#46566a;
  --accent:#7db4b6; --accent-ink:#0e1a1b; --accent-soft:#1d3335;
  --ok:#6cc893; --ok-soft:#173023; --warn:#e2b053; --warn-soft:#352a12; --bad:#ec8b7e; --bad-soft:#3a1d1a;
  --fix:#8cb4ec; --fix-soft:#1a2a40; --none:#a3abb7; --none-soft:#242c36;
  --mark:#f0c14b; --mark-soft:#3a3115; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;overflow:hidden}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto;width:100%}
header{flex:none;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:12px 4px}
h1{font:600 24px/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.grow{flex:1 1 auto;min-width:0}
.sync{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--none-soft);color:var(--none);white-space:nowrap}
.sync.on{background:var(--ok-soft);color:var(--ok)} .sync.ro{background:var(--warn-soft);color:var(--warn)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{all:unset;cursor:pointer;padding:9px 13px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
nav .count{font-weight:500;font-size:12px;margin-left:4px;padding:1px 7px;border-radius:99px;background:var(--bad-soft);color:var(--bad)}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding-block:12px}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.head{flex:none;display:flex;flex-direction:column;gap:8px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input,select,button,textarea{font:inherit;color:inherit}
input[type=search],input[type=text],input[type=number],input[type=date],input[type=url],input[type=month],select,textarea{background:var(--field);border:1px solid var(--fieldline);border-radius:6px;padding:7px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:7px 14px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{color:var(--muted);font-size:13px;max-width:80ch;margin:0}
.banner{flex:none;background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:9px 14px;font-size:13px;margin-bottom:10px}
.scroll{flex:1;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.scroll.bare{background:none;border:0}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:640px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);position:sticky;top:0;z-index:2}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right}
.name{font-weight:600}
.printed{color:var(--muted)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.s-ok{background:var(--ok-soft);color:var(--ok)} .s-warn{background:var(--warn-soft);color:var(--warn)}
.s-bad{background:var(--bad-soft);color:var(--bad)} .s-none{background:var(--none-soft);color:var(--none)} .s-fix{background:var(--fix-soft);color:var(--fix)}
.s-plan{background:var(--accent-soft);color:var(--accent)}
.role{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.role.p{color:var(--accent)}
.never{color:var(--bad);font-weight:600}
.dim{color:var(--muted)}
.fixed{color:var(--fix)}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--sunk)}
tr.marked td{background:var(--mark-soft)}
tr.marked:hover td{background:var(--mark-soft)}
.star{all:unset;cursor:pointer;font-size:17px;line-height:1;color:var(--line);padding:2px 4px;border-radius:4px}
.star.on{color:var(--mark)}
.star:hover{color:var(--mark)}
.star:focus-visible{outline:2px solid var(--accent)}
.star:disabled{cursor:default}
tr.detail td{background:var(--sunk)}
.hist{display:grid;grid-template-columns:auto auto 1fr;gap:4px 14px;font-size:13px}
.editor{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;padding:6px 0}
.editor .field{flex:1 1 220px}
.editor .scope{display:flex;flex-direction:column;gap:4px;font-size:13px}
.more{display:flex;justify-content:center;padding:10px}
.meet{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding-bottom:8px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mcard h3{margin:0;font:600 17px/1.2 var(--display)}
.mline{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:13px}
.mline>span:first-child{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:20}
.addform{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
h2{font:600 18px/1.2 var(--display);margin:0}
.sec{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;background:var(--surface);position:sticky;top:0;z-index:3}
/* plan */
.plan{display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.pcard.dirty{border-color:var(--accent)}
.pcard.past{opacity:.92}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.phead h3{margin:0;font:600 19px/1.2 var(--display)}
.pgrid{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;align-items:start}
.pgrid>label{font-size:12px;font-weight:600;color:var(--muted);padding-top:8px}
.slot{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slot input{flex:1 1 220px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 2px}
.sugg button{all:unset;cursor:pointer;font-size:12.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--sunk)}
.sugg button.m{border-color:var(--mark);background:var(--mark-soft)}
.sugg button:hover{border-color:var(--accent)}
.sugg button:focus-visible{outline:2px solid var(--accent)}
.sugg .dim{font-size:12px}
.pactions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acting{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.acting select{padding:4px 8px;font-size:13px}
.acting select.need{border-color:var(--bad);color:var(--bad)}
.alert{flex:none;background:var(--bad-soft);color:var(--ink);border-radius:var(--r);padding:9px 14px;font-size:13px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.alert b{color:var(--bad)}
.bulk{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--accent-soft);border-radius:var(--r);padding:10px 12px}
.bulk .field{flex:0 1 auto}
.chk{width:16px;height:16px;accent-color:var(--accent)}
.s-def{background:var(--none-soft);color:var(--none)} .s-hold{background:var(--bad-soft);color:var(--bad)}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dcard h3{margin:0;font:600 17px/1.2 var(--display);display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.dsec{display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.dsec>h2{display:flex;gap:8px;align-items:baseline}
.log{display:grid;grid-template-columns:auto auto 1fr;gap:3px 12px;font-size:12.5px}
.log span:nth-child(3n+1){color:var(--muted);white-space:nowrap}
.dact{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.dact input[type=text]{flex:1 1 200px}
.bish{display:grid;grid-template-columns:1fr 180px;gap:8px;max-width:560px;padding:12px 14px}
.datebtn{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:3px}
.datebtn:hover{text-decoration-color:var(--accent)}
.datebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.overlay{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--ink) 35%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:max(48px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);padding:18px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.modal h3{margin:0;font:600 22px/1.2 var(--display)}
.prog{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px}
.prog>span:nth-child(odd){color:var(--muted);font-size:12.5px;padding-top:2px}
.prog .who{display:flex;flex-direction:column;gap:2px}
.prog .me{background:var(--mark-soft);border-radius:4px;padding:0 4px;margin:0 -4px;font-weight:700}
.prog .age{color:var(--muted);font-size:12px;font-weight:400}
.modalnav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.seg.single button{padding:7px 12px}
@media (max-width:600px){h1{font-size:21px} .mline{grid-template-columns:80px 1fr} .pgrid{grid-template-columns:1fr} .pgrid>label{padding-top:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
